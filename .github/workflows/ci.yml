name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # prose-lint is a private repo; this lets npm ci authenticate when fetching it.
      # npm tries the SSH form of github.com URLs regardless of what's in package.json, so both forms need rewriting to the token'd HTTPS URL.
      - name: Configure access to private dependencies
        run: |
          git config --global url."https://${{ secrets.PROSE_LINT_PAT }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://${{ secrets.PROSE_LINT_PAT }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test
